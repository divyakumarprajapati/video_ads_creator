###############################################################################
# docker-compose.local.yml – minimal stack (Postgres only)
#
# Usage:
#   docker compose -f docker-compose.local.yml up -d
#   # then run the API on your host machine:
#   uvicorn app.main:app --reload
###############################################################################

version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: video_ads
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
